services:
  reth:
    container_name: morph-reth
    image: ghcr.io/morph-l2/morph-reth:v1.3.0
    restart: unless-stopped
    ports:
      - "8545:8545"
      - "8546:8546"
      - "8551"
      - "6060"
      - "30303"
    volumes:
      - "${RETH_HOME}/reth-data:/db"
      - "${JWT_SECRET_FILE}:/jwt-secret.txt"
      - "${RETH_ENTRYPOINT_FILE}:/entrypoint.sh"
    environment:
      # Chain spec: "mainnet" or "hoodi".
      - RETH_CHAIN=${RETH_CHAIN}
      - RETH_DATADIR=/db
      - LOG_DIR=/db
      # static-nodes.json lives inside the reth-data volume (mounted at /db) and is
      # parsed into --trusted-peers by the entrypoint. If absent, --trusted-peers is
      # omitted rather than failing.
      - STATIC_NODES_FILE=/db/static-nodes.json
    entrypoint:
      - "/bin/sh"
      - "/entrypoint.sh"

  # Single self-verifying node, identical to docker-compose.yml except it talks to
  # the reth execution client instead of geth. There is no separate validator
  # service: every node verifies batches via --derivation.verify-mode. Set
  # DERIVATION_VERIFY_MODE=layer1 (in .env/.env_hoodi) for the former validator
  # behavior. L1_BEACON_CHAIN_RPC is required in both modes.
  node:
    container_name: morph-node
    depends_on:
      reth:
        condition: service_started
    image: ghcr.io/morph-l2/node:0.6.3
    restart: unless-stopped
    ports:
      - "26656"
      - "26657"
      - "26658"
      - "26660"
    environment:
      - MORPH_NODE_L2_ETH_RPC=http://morph-reth:8545
      - MORPH_NODE_L2_ENGINE_RPC=http://morph-reth:8551
      - MORPH_NODE_L2_ENGINE_AUTH=/jwt-secret.txt
      - MORPH_NODE_L1_ETH_RPC=${L1_ETH_RPC}
      - MORPH_NODE_L1_ETH_BEACON_RPC=${L1_BEACON_CHAIN_RPC}
      - MORPH_NODE_L1_CHAIN_ID=${L1_CHAIN_ID}
      - MORPH_NODE_ROLLUP_ADDRESS=${ROLLUP_CONTRACT}
      - MORPH_NODE_SYNC_DEPOSIT_CONTRACT_ADDRESS=${L1MESSAGEQUEUE_CONTRACT}
      - MORPH_NODE_SYNC_START_HEIGHT=${L1_MSG_START_HEIGHT}
      - MORPH_NODE_DERIVATION_START_HEIGHT=${DERIVATION_START_HEIGHT}
      - MORPH_NODE_DERIVATION_BASE_HEIGHT=${L2_BASE_HEIGHT}
      - MORPH_NODE_DERIVATION_VERIFY_MODE=${DERIVATION_VERIFY_MODE:-}
      - NODE_EXTRA_FLAGS=${NODE_EXTRA_FLAGS:-}
    volumes:
      - "${RETH_HOME}/node-data:/db"
      - "${JWT_SECRET_FILE}:/jwt-secret.txt"
      - "./entrypoint-node.sh:/entrypoint-node.sh"
    entrypoint:
      - "/bin/sh"
      - "/entrypoint-node.sh"
